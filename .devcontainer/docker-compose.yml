services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    # Dev-only placeholder values (never real secrets/prod config) - see ../.env.dev
    # for what's set and why. app/config.py's Settings has no default for these, so
    # every context (this container, tests, e2e, a real deployment) must supply its
    # own values explicitly instead of one silently standing in for all of them.
    env_file: ../.env.dev
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: papertrail
      POSTGRES_PASSWORD: papertrail
      POSTGRES_DB: papertrail
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U papertrail"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Deliberately no `ports:` mapping - each clone's devcontainer is opened
    # independently, so a fixed host port would collide across agents.

volumes:
  pgdata:
    # No explicit `name:` - Compose auto-prefixes this with the project name
    # (<clone-basename>_devcontainer), giving every clone its own volume.
